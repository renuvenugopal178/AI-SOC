version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: ai-soc-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: change_me_password
      MONGO_INITDB_DATABASE: ai-soc
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--bind_ip_all"]

volumes:
  mongo_data:
